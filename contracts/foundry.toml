[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
]

# Lean profile for deploying PredictionMarketFactory only.
# Usage:
#   FOUNDRY_PROFILE=pmf forge build
#   FOUNDRY_PROFILE=pmf forge script script/DeployPredictionMarketFactory.s.sol \
#       --rpc-url base_sepolia --broadcast
[profile.pmf]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
test = "test_disabled_for_pmf"  # point at a non-existent dir to skip tests
skip = [
    # src — keep only OutcomeToken / PredictionMarket / PredictionMarketFactory
    #       and src/interfaces/* (needed by PredictionMarket / Factory)
    "src/Bet.sol",
    "src/BetFactory.sol",
    "src/BetPoR.sol",
    "src/EventBet.sol",
    "src/EventBetFactory.sol",
    "src/OracleRegistry.sol",
    "src/PriceOracle.sol",
    "src/PriceOracleFactory.sol",
    "src/v4/**",
    # script — keep only DeployPredictionMarketFactory.s.sol
    "script/CreateSampleMarket.s.sol",
    "script/DeployBetFactory.s.sol",
    "script/DeployBetPoR.s.sol",
    "script/DeployEventBetFactory.s.sol",
    "script/DeployFullStack.s.sol",
    "script/DeployMockUSDC.s.sol",
    "script/DeployOracleRegistry.s.sol",
    "script/DeployPredictionHook.s.sol",
    "script/DeployPriceOracleFactory.s.sol",
]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
]

[fuzz]
runs = 256

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"
arc_testnet  = "${ARC_TESTNET_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=84532", chain = 84532 }
base_mainnet = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=8453", chain = 8453 }
# arc_testnet = { key = "${ARC_EXPLORER_API_KEY}", url = "https://arc-testnet.drpc.org/api", chain = 5042002 }
robinhood_testnet = { key = "${ROBINHOOD_EXPLORER_API_KEY}", url = "https://explorer.testnet.chain.robinhood.com/api/", chain = 46630 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
